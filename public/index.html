<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Eliware Radar</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="dashboard">
      <section class="scene-panel" aria-label="Aircraft radar view">
        <button class="reset-view" data-reset type="button">Reset view</button>
        <div class="scene-labels">
          <p class="scene-title" data-view-title>LOCAL 3D SPACE</p>
          <p data-home>Loading home position.</p>
        </div>
        <div class="scene" data-scene></div>
        <p class="controls-hint" data-controls-hint>
          Drag to rotate · Right-drag to pan · Scroll to zoom
        </p>
        <p class="feed-status" data-status role="status">Loading aircraft feed.</p>
      </section>
    </main>
    <script type="module" src="/client.js"></script>
  </body>
</html>

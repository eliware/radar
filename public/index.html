<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Eliware Radar</title>
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Radar" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/radar-180.png" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="dashboard">
      <section class="scene-panel" aria-label="Aircraft radar view">
        <a
          class="map-attribution"
          href="https://www.openstreetmap.org/copyright"
          target="_blank"
          rel="noreferrer"
        >
          © OpenStreetMap · OpenMapTiles · OpenFreeMap
        </a>
        <div
          class="radar-compass"
          data-radar-compass
          role="button"
          tabindex="0"
          aria-label="Reset view. N E S W 000. Radar heading 000 degrees"
        >
          <svg viewBox="0 0 116 116" aria-hidden="true">
            <g data-compass-rose transform="rotate(0 58 58)">
              <defs>
                <line id="north-point" x1="58" y1="58" x2="58" y2="30" />
                <line id="cardinal-point" x1="58" y1="58" x2="58" y2="29" />
                <line id="diagonal-point" x1="58" y1="58" x2="58" y2="34" />
                <line id="secondary-point" x1="58" y1="58" x2="58" y2="40" />
              </defs>
              <circle class="compass-ring" cx="58" cy="58" r="53" />
              <use class="compass-north" href="#north-point" />
              <use class="compass-cardinal" href="#cardinal-point" transform="rotate(90 58 58)" />
              <use class="compass-cardinal" href="#cardinal-point" transform="rotate(180 58 58)" />
              <use class="compass-cardinal" href="#cardinal-point" transform="rotate(270 58 58)" />
              <use class="compass-diagonal" href="#diagonal-point" transform="rotate(45 58 58)" />
              <use class="compass-diagonal" href="#diagonal-point" transform="rotate(135 58 58)" />
              <use class="compass-diagonal" href="#diagonal-point" transform="rotate(225 58 58)" />
              <use class="compass-diagonal" href="#diagonal-point" transform="rotate(315 58 58)" />
              <use
                class="compass-intercardinal"
                href="#secondary-point"
                transform="rotate(22.5 58 58)"
              />
              <use
                class="compass-intercardinal"
                href="#secondary-point"
                transform="rotate(67.5 58 58)"
              />
              <use
                class="compass-intercardinal"
                href="#secondary-point"
                transform="rotate(112.5 58 58)"
              />
              <use
                class="compass-intercardinal"
                href="#secondary-point"
                transform="rotate(157.5 58 58)"
              />
              <use
                class="compass-intercardinal"
                href="#secondary-point"
                transform="rotate(202.5 58 58)"
              />
              <use
                class="compass-intercardinal"
                href="#secondary-point"
                transform="rotate(247.5 58 58)"
              />
              <use
                class="compass-intercardinal"
                href="#secondary-point"
                transform="rotate(292.5 58 58)"
              />
              <use
                class="compass-intercardinal"
                href="#secondary-point"
                transform="rotate(337.5 58 58)"
              />
              <text class="compass-label compass-label-north" x="58" y="10">N</text>
              <text class="compass-label compass-label-cardinal" x="106" y="58">E</text>
              <text class="compass-label compass-label-cardinal" x="58" y="106">S</text>
              <text class="compass-label compass-label-cardinal" x="10" y="58">W</text>
            </g>
            <circle class="compass-hub" cx="58" cy="58" r="18" />
            <text data-compass-heading x="58" y="58">000</text>
          </svg>
        </div>
        <button class="compass-follow" data-compass-follow type="button" aria-pressed="false">
          FOLLOW PHONE
        </button>
        <section class="metar-display" data-metar data-radar-mode="3D" aria-label="METAR reports">
          <div class="metar-reports" data-metar-reports>Loading METAR reports.</div>
          <div class="metar-ticker" aria-hidden="true"><span data-metar-ticker></span></div>
        </section>
        <div class="scene" data-scene></div>
      </section>
      <section
        class="flight-strips-panel"
        data-flight-strips
        aria-label="Aircraft flight strips"
      ></section>
    </main>
    <script type="module" src="/client.js"></script>
  </body>
</html>

services:
  readsb:
    build:
      context: .
      dockerfile: Dockerfile.readsb
    command:
      [
        "--device-type",
        "rtlsdr",
        "--net",
        "--net-sbs-port",
        "30003",
        "--net-bo-port",
        "30005",
        "--quiet",
      ]
    device_cgroup_rules:
      - "c 189:* rwm"
    expose:
      - "30003"
      - "30005"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "30003"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    volumes:
      - type: bind
        source: /dev/bus/usb
        target: /dev/bus/usb
    networks:
      - radar

  adsbx:
    image: ghcr.io/sdr-enthusiasts/docker-adsbexchange:latest
    depends_on:
      readsb:
        condition: service_healthy
    environment:
      BEASTHOST: readsb
      BEASTPORT: "30005"
      LAT: ${ADSB_LAT:?Set ADSB_LAT in .env}
      LONG: ${ADSB_LON:?Set ADSB_LON in .env}
      ALT: ${ADSB_ALT:?Set ADSB_ALT in .env}ft
      SITENAME: "${ADSBX_SITENAME:-Home Roof}"
      UUID: ${ADSBX_UUID:?Set ADSBX_UUID in .env}
      TZ: ${TZ:-UTC}
    restart: unless-stopped
    tmpfs:
      - /run:rw,nosuid,nodev,exec,relatime,size=64M,uid=1000,gid=1000
    networks:
      - radar

  piaware:
    image: ghcr.io/sdr-enthusiasts/docker-piaware:latest
    depends_on:
      readsb:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      RECEIVER_TYPE: relay
      BEASTHOST: readsb
      BEASTPORT: "30005"
      FEEDER_ID: ${PIAWARE_FEEDER_ID:?Set PIAWARE_FEEDER_ID in .env}
    restart: unless-stopped
    tmpfs:
      - /run:exec,size=64M
      - /var/log
    networks:
      - radar

  fr24:
    image: ghcr.io/sdr-enthusiasts/docker-flightradar24:latest
    profiles:
      - fr24
    depends_on:
      readsb:
        condition: service_healthy
    environment:
      BEASTHOST: readsb
      BEASTPORT: "30005"
      FR24KEY: ${FR24_KEY:-}
      MLAT: "no"
    restart: unless-stopped
    networks:
      - radar

  radar:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      readsb:
        condition: service_healthy
    environment:
      ADSB_HOST: readsb
      ADSB_PORT: "30003"
    env_file:
      - path: .env
        required: false
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - radar

networks:
  radar:
    driver: bridge

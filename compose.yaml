services:
  dump978:
    image: ghcr.io/sdr-enthusiasts/docker-dump978:latest
    environment:
      TZ: ${TZ:-UTC}
      LAT: ${ADSB_LAT:?Set ADSB_LAT in .env}
      LON: ${ADSB_LON:?Set ADSB_LON in .env}
      DUMP978_RTLSDR_DEVICE: ${UAT_SDR_DEVICE:?Set UAT_SDR_DEVICE in .env}
    device_cgroup_rules:
      - "c 189:* rwm"
    volumes:
      - type: bind
        source: /dev/bus/usb
        target: /dev/bus/usb
    restart: unless-stopped
    networks:
      - radar

  readsb:
    image: ghcr.io/wiedehopf/readsb:latest
    command:
      [
        "--device-type",
        "rtlsdr",
        "--device",
        "${READSB_DEVICE:?Set READSB_DEVICE in .env}",
        "--net",
        "--net-sbs-port",
        "30003",
        "--net-bo-port",
        "30005",
        "--net-connector=dump978,30978,uat_in",
        "--quiet",
      ]
    depends_on:
      dump978:
        condition: service_started
    device_cgroup_rules:
      - "c 189:* rwm"
    expose:
      - "30003"
      - "30005"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "30003"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    volumes:
      - type: bind
        source: /dev/bus/usb
        target: /dev/bus/usb
    networks:
      - radar

  adsbx:
    image: ghcr.io/sdr-enthusiasts/docker-adsbexchange:latest
    depends_on:
      readsb:
        condition: service_healthy
    environment:
      BEASTHOST: readsb
      BEASTPORT: "30005"
      LAT: ${ADSB_LAT:?Set ADSB_LAT in .env}
      LONG: ${ADSB_LON:?Set ADSB_LON in .env}
      ALT: ${ADSB_ALT:?Set ADSB_ALT in .env}ft
      SITENAME: "${ADSBX_SITENAME:-Home Roof}"
      UUID: ${ADSBX_UUID:?Set ADSBX_UUID in .env}
      TZ: ${TZ:-UTC}
    restart: unless-stopped
    tmpfs:
      - /run:rw,nosuid,nodev,exec,relatime,size=64M,uid=1000,gid=1000
    networks:
      - radar

  piaware:
    image: ghcr.io/sdr-enthusiasts/docker-piaware:latest
    depends_on:
      readsb:
        condition: service_healthy
      dump978:
        condition: service_started
    environment:
      TZ: ${TZ:-UTC}
      RECEIVER_TYPE: relay
      BEASTHOST: readsb
      BEASTPORT: "30005"
      UAT_RECEIVER_TYPE: relay
      UAT_RECEIVER_HOST: dump978
      UAT_RECEIVER_PORT: "30978"
      FEEDER_ID: ${PIAWARE_FEEDER_ID:?Set PIAWARE_FEEDER_ID in .env}
    restart: unless-stopped
    tmpfs:
      - /run:exec,size=64M
      - /var/log
    networks:
      - radar

  adsblol:
    image: ghcr.io/sdr-enthusiasts/docker-adsb-ultrafeeder:latest
    depends_on:
      readsb:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      READSB_NET_ONLY: "true"
      READSB_LAT: ${ADSB_LAT:?Set ADSB_LAT in .env}
      READSB_LON: ${ADSB_LON:?Set ADSB_LON in .env}
      READSB_ALT: ${ADSB_ALT:?Set ADSB_ALT in .env}ft
      MLAT_USER: RadarHomeRoof
      ULTRAFEEDER_CONFIG: "adsb,readsb,30005,beast_in;adsb,in.adsb.lol,30004,beast_reduce_plus_out,uuid=${ADSBLOL_UUID:?Set ADSBLOL_UUID in .env};mlat,in.adsb.lol,31090,39599,uuid=${ADSBLOL_UUID:?Set ADSBLOL_UUID in .env},--privacy"
    restart: unless-stopped
    tmpfs:
      - /run/readsb
      - /var/log
    networks:
      - radar

  fr24:
    image: ghcr.io/sdr-enthusiasts/docker-flightradar24:latest
    depends_on:
      readsb:
        condition: service_healthy
    environment:
      BEASTHOST: readsb
      BEASTPORT: "30005"
      FR24KEY: ${FR24_KEY:-}
      FR24KEY_UAT: ${FR24_UAT_KEY:-}
      UATHOST: dump978
      UATPORT: "30978"
      MLAT: "no"
    restart: unless-stopped
    networks:
      - radar

  radar:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      readsb:
        condition: service_healthy
    environment:
      ADSB_HOST: readsb
      ADSB_PORT: "30003"
    env_file:
      - path: .env
        required: false
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:1390/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - "1390:1390"
    restart: unless-stopped
    networks:
      - radar

networks:
  radar:
    driver: bridge

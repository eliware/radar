version: "12.0"
description: Repository-specific guidance for the Eliware Radar.
directives:
  - id: E-1390.0
    dos:
      - Build an aviation app that reads decoded ADS-B records from one RTL1090 TCP feed.
      - Keep the second SDR available to other apps.
      - Keep recent aircraft data in memory. Do not write aircraft data to files.
      - Parse all available feed fields into named values. Do not keep a rawLine field.
      - Keep the CLI table as the default output. Redraw it every second.
      - Print one aircraft JSON object per feed update with `--debug`.
      - Retry feed errors after two seconds. Write errors to standard error.
      - Sort aircraft by distance from `MY_LOCATION`, with the closest aircraft first.
      - Calculate distance and bearing from decimal coordinates in `MY_LOCATION`.
      - Read `MY_LOCATION` and `MY_ELEVATION` from `.env`. Default elevation to 300 feet.
      - Load `.env` settings with `dotenv`.
      - Use the full terminal width for the CLI table. Space each field evenly.
      - Use full field names on wide terminals. Use short names when the width is limited.
      - Use short headers to keep data on one line before wrapping fields.
      - Use two lines when short headers do not fit. Use three only when two lines do not fit.
      - Allow no more than three lines for each header or aircraft row.
      - Show table headers once. Do not repeat headers in aircraft rows.
      - Keep all table borders and column dividers aligned at each terminal width.
      - Align the aircraft count divider with the last column divider below it.
      - Use a double outer border and a double divider below the title row.
      - Use Unicode box drawing lines.
      - Show the aircraft count at the right side of the title row.
      - Use single horizontal dividers between aircraft rows and single column dividers in aircraft rows.
      - Put CLI code in `src/cli/`, browser code in `src/frontend/`, server code in `src/backend/`, and shared code in `src/shared/`.
      - Add one matching test for each source module.
      - Use Fastify for the web server. Provide REST routes and a WebSocket feed.
      - Provide `GET /health`, `GET /api/config`, and `GET /api/aircraft`.
      - Send the same aircraft JSON schema over `/ws` that `--debug` prints.
      - Read FAA NASR airport and runway data from SQLite in read-only mode.
      - Return airports by distance band through `GET /api/airports`.
      - Return VOR, VOR/DME, and VORTAC records by distance band through `GET /api/navaids`.
      - Return nearby ordered FAA ARTCC boundary paths through `GET /api/airspace-boundaries`.
      - Return operational ILS records by distance band through `GET /api/ils`.
      - Fetch airports from zero to the current view range at startup.
      - Fetch only the new outer distance band when the view expands.
      - Limit airport range requests to 300 nautical miles.
      - Keep fetched airport and runway data in browser memory.
      - Keep fetched ILS data in browser memory. Request only the new outer distance band.
      - Show only public-use airports with a four-character ICAO code that starts with K.
      - Show airports only when they have an asphalt or concrete runway at least 1,000 feet long.
      - Draw only qualifying asphalt and concrete runways.
      - Draw airport markers and codes in light gray.
      - Center airport labels above their marker dots.
      - Draw runways as solid gray lines.
      - Draw runway geometry at each runway end's NASR elevation.
      - Draw much darker gray dotted 10-nautical-mile runway centerline extensions from both runway ends.
      - Raise each extended centerline to 3,000 feet above its runway end elevation.
      - Draw much darker gray dotted 10-nautical-mile perpendicular base-leg marks at extension ends.
      - Draw each base leg at the altitude of its extended centerline endpoint.
      - Draw VOR symbols and identifiers in blue.
      - Show ILS course guides by default in both radar views. Press I to toggle them.
      - Draw dashed cyan ILS course guides for 10 nautical miles from each glide-slope site.
      - Draw NASR ILS marker beacons as small hollow cyan circles at their coordinates.
      - Do not show text labels on ILS guides.
      - Extend ILS course guides away from the runway on the reciprocal of the corrected true approach course.
      - Follow the NASR glide-slope angle in 3D. Draw ILS course guides flat in Canvas.
      - Treat ILS course guides as visual guides. Do not present them as complete approach paths.
      - Draw approximate 5- and 10-mile rings around airports with the NASR Class C flag.
      - Identify approximate Class C rings as visual guides, not official boundaries.
      - Draw gray approximate Class B, C, and D altitude shells in the 3D view.
      - Use typical layered Class B, C, and D altitudes when NASR has only a class flag.
      - Mark all class-based airspace shells as approximate, not official boundaries.
      - Draw actual ARTCC boundary paths from NASR `ARB_SEG` points.
      - Do not present ARTCC boundaries as approach control boundaries.
      - Do not require authentication for local REST or WebSocket access.
      - Serve the local page, CSS, and built JavaScript from the web server.
      - Build the first web view as a Three.js 3D space without a map or terrain.
      - Show a 2D Canvas radar when WebGL cannot start. Keep the 3D radar when WebGL works.
      - Place the home marker at the `MY_LOCATION` origin and the `MY_ELEVATION` height.
      - Place aircraft by their coordinates and feed altitude relative to the home height.
      - Set the default camera to a top-down view centered on home. Keep north at the top.
      - On mobile, keep home centered and disable panning.
      - Use pinch gestures to zoom on mobile.
      - Use two-finger twist gestures to rotate the radar on mobile.
      - Do not show gesture instructions or text connection status on the radar view.
      - Show the home location at the top left of the radar view. Do not show a view title.
      - Use a black background for the page and radar scope.
      - Use green radar text, markers, paths, and axes on black.
      - Use darker green for minor rings and aircraft history marks.
      - Show the radar in dark gray while the aircraft feed is disconnected. Show it in green while connected.
      - Retry the WebSocket feed after a disconnect. Start with a one-second delay and double it to a 30-second maximum.
      - Refresh the aircraft list after each WebSocket connection.
      - Keep the radar scope borderless.
      - Set radar range from 1 through 300 nautical miles in both views.
      - Set the default range to 20 nautical miles or 5 miles past the furthest live target, whichever is larger.
      - Keep auto-zoom active until the user changes the view. Resume auto-zoom after reset.
      - Remove aircraft targets after 120 seconds without an update.
      - Fade aircraft markers and labels from full brightness to invisible over 120 seconds without updates.
      - Keep range limits, auto-zoom, and ring spacing the same in 3D and Canvas views.
      - "Show each aircraft label as three lines: callsign, altitude, then speed and aircraft type code when known."
      - Show the ICAO code when callsign is blank or unknown, or equals `AD`, `OK`, or `RM`.
      - Keep a useful callsign when later updates contain only a blank, unknown, `AD`, `OK`, or `RM` value.
      - Show altitude in hundreds of feet.
      - Pad altitude below 10,000 feet to three digits with leading zeroes.
      - Add C when vertical rate stays within ±100 feet per minute.
      - Otherwise, add the signed vertical rate in hundreds of feet per minute.
      - Spread labels to reduce overlap. Draw a leader line from each label to its aircraft.
      - Draw upright hollow green diamond aircraft markers in both radar views.
      - Draw a forward path to each aircraft's estimated position 60 seconds later.
      - Show aircraft history as dark-green backslash marks at earlier positions.
      - Show no more than 60 seconds of aircraft history marks.
      - Draw aircraft history marks at half the size of the aircraft labels.
      - Leave a 9-pixel gap between each aircraft diamond and its leader line.
      - Leave a 7-pixel gap between each leader line and the label text.
      - Show range values without unit text on rings in both radar views.
      - Anchor each range label at the ring it names.
      - Place range labels due north of home in both radar views.
      - Center each range label vertically on its ring.
      - Leave a small ring gap behind each range label.
      - Show a nautical mile scale and a symbol legend at the lower left of both radar views.
      - Use 18-pixel aircraft labels in 3D and 9-pixel labels in Canvas.
      - Keep 3D aircraft labels twice the size of Canvas labels.
      - Scale 3D range ring thickness with zoom range to keep its screen thickness steady.
      - Draw solid major rings every 10 nautical miles below 60 miles, every 20 below 150 miles, then every 50 miles.
      - Draw darker solid rings halfway between each major ring.
      - Label major range rings only. Keep labels and ring spacing the same in both radar views.
      - Draw range rings through 300 nautical miles.
      - Allow full camera rotation, tilt, pan, zoom, and a reset to the default view.
      - Describe feed altitude as barometric altitude. Do not claim it always equals true MSL altitude.
      - Keep the dashboard focused on the 3D view, flight strips, and aircraft details.
      - Keep the radar view square and align it to the top left of the page.
      - Size the radar view to the shorter viewport dimension.
      - Reserve space to the right of the radar view in landscape layout for flight strips.
      - Reserve space below the radar view in portrait layout for flight strips.
      - Show aircraft flight strips beside the radar in landscape layout and below it in portrait layout.
      - Sort web flight strips by distance from home, with the closest aircraft first.
      - Show callsign, combined altitude and vertical rate, aircraft type code, combined heading and speed, squawk, a blank field, combined bearing and range, origin, and destination in flight strips.
      - Format flight strip altitude and vertical rate as the aircraft radar labels do.
      - Omit ICAO, position, and age from flight strips.
      - Omit units from flight strip values. Keep the degree sign on headings.
      - Put the aircraft type code after the speed on the third radar label line, separated by one space.
      - Put the aircraft type code in the speed field position in flight strips.
      - Keep a blank field in the former aircraft type code position in flight strips.
      - Combine flight strip heading and speed as three-digit heading, degree sign, and speed.
      - Combine flight strip bearing and range as three-digit bearing, degree sign, and rounded whole nautical miles.
      - Put origin and destination airport codes in the last two flight strip fields when known.
      - Use ADSBdb aircraft lookup by ICAO hex for aircraft type codes.
      - Use ADSBdb callsign lookup for origin and destination airport codes only.
      - Cache ADSBdb lookups in server memory by ICAO hex and callsign.
      - Do not show field header rows in flight strips.
      - Wrap flight strip fields into two rows, then three rows as width decreases.
      - Use equal column widths in each wrapped flight strip row.
      - Hide flight strip scrollbars while keeping the aircraft list scrollable.
      - Use a black background, white text, a double outer border, and single aircraft dividers in flight strips.
      - Remove the page header and footer.
      - Place the reset control at the top right over the radar view.
      - Show a passive 16-point compass at the lower right of both radar views.
      - Make the north point 1.5 times as long as the south, east, and west points.
      - Make the northeast, northwest, southeast, and southwest points half as long as the cardinal points.
      - Make the other eight points half as long as the diagonal points.
      - Label only north, south, east, and west. Make the north label slightly more prominent.
      - Rotate the compass star and labels with the radar view.
      - Show the rotation as an upright three-digit value from 000 through 359 at the compass center.
      - Do not let compass clicks or touches change the radar view.
      - Show selected aircraft fields in flight strips and aircraft details.
      - Mark missing flight strip values with a dash.
      - Draw FAA ARTCC boundary paths in gray when the NASR data provides them.
      - Do not label ARTCC paths as Portland or A90 approach boundaries.
      - Load airport, navaid, airspace, and boundary data only through the current zoom range.
      - Load ILS data only through the current zoom range.
      - Leave radio controls out of the dashboard until requested.
      - Document the RTL1090 background and foreground procedures in `docs/`.
      - Provide browser assets, documented routes, and mirrored tests.
      - Keep package names and image names consistent with Radar.
    donts:
      - Read or decode raw SDR samples in the Radar app.
      - Write an aircraft JSON file for another app to watch.
      - Print the flight table in `--debug` mode.
      - Use more than three display lines for a table header or aircraft row.
      - Add a map, terrain, or radio panel to the first 3D view.
